# K2BR Repeater Bot — tooling configuration.
# (Runtime dependencies live in requirements.txt; this file only configures
# pytest and ruff. The project is run from source, not installed as a package.)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The app modules configure logging (Rich console handler) at import; keep
# pytest's own capture from double-printing every record.
log_cli = false

[tool.ruff]
line-length = 120
target-version = "py312"
# Generated/vendored content and the fixture tree aren't lint targets.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Pragmatic, bug-focused ruleset: pyflakes (undefined names, unused imports),
# the error-class pycodestyle rules, bugbear (B), plus async-correctness
# (ASYNC), logging-correctness (LOG), and Ruff's own correctness rules (RUF).
# Style-only rules stay out of scope on purpose — this codebase favors aligned
# assignments and long explanatory comments, and churning it for cosmetics
# (UP/SIM/PERF, the formatter) buys nothing.
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "LOG", "RUF"]
ignore = [
    "E701",  # compact `if cond: return` guard — deliberate house idiom
    "E702",  # compact statements in tiny test fakes
    "E731",  # lambda assignments — used intentionally for tiny callbacks
    "E741",  # ambiguous single-letter names — not present, but harmless
    "B008",  # function call in default arg — discord.py decorator idiom
    "RUF001",  # "ambiguous" Unicode in strings — our ·, —, … are intentional
    "RUF002",  # …same, in docstrings
    "RUF003",  # …same, in comments
]

[tool.ruff.lint.per-file-ignores]
# TYPE_CHECKING-gated and lazy imports are load-bearing in the bot module
# (heavy deps are imported only when the feature is used).
"allstar_discord_bot.py" = ["E402"]
"tests/*" = ["E402"]  # conftest must chdir before app imports

[tool.mypy]
python_version = "3.12"
# Type-check the application modules. Tests use fakes/mocks and stay out of
# scope for now — same posture as ruff excluding the fixtures.
files = ["allstar_discord_bot.py", "ami.py", "config.py", "qrz.py", "repeater_audio.py", "solar.py"]
warn_unused_ignores = true
warn_redundant_casts = true

# discord-ext-voice-recv and PyYAML ship no type information (no py.typed).
[[tool.mypy.overrides]]
module = ["discord.ext.voice_recv.*", "yaml"]
ignore_missing_imports = true

# allstar_discord_bot.py (~3k lines) was type-cleaned incrementally (the mypy
# burn-down batches: 124 → 69 → 0 errors) and is now checked with no per-module
# error-code override — every error code gates CI like the other modules. The
# handful of genuine framework-typing gaps that remain use narrow inline
# `# type: ignore[code]` comments at the call site (see the discord.py
# hybrid_command decorators and the voice_recv client methods).
